[package]
name = "garage"
version = "0.2.4"
edition = "2024"
description = "Local-first file toolkit: PDFs, images, and Bikram Sambat dates. Nothing leaves the machine."
license = "AGPL-3.0-or-later"

[dependencies]
gpui-kit = "=0.10.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
