name: Build Windows executable
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Rust
        shell: pwsh
        run: rustup toolchain install stable --profile minimal
      - name: Build portable Windows package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Check packaged engine
        shell: pwsh
        run: |
          $engine = Resolve-Path dist/garage-engine.exe
          $reply = '{"id":"ping","op":"ping","args":{}}' | & $engine | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged engine smoke check failed.' }
          if ($reply.event -ne 'done' -or -not $reply.result.features.pdf -or -not $reply.result.features.c2pa) {
            throw 'The packaged engine is missing required document libraries.'
          }
      - uses: actions/upload-artifact@v7
        with:
          name: Garage-windows-x86_64
          path: dist/Garage-*-windows-x86_64.zip
          if-no-files-found: error
