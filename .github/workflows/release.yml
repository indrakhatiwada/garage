name: Build and release

on:
  pull_request:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
          - platform: windows-x86_64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify versions
        run: python scripts/check-package.py versions
      - name: Set up MSVC and Windows SDK
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libssl-dev \
            libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev libasound2-dev \
            libudev-dev squashfs-tools xkb-data
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -Vv > rust-version.txt
      - name: Cache Rust dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: rust-${{ matrix.os }}-${{ hashFiles('rust-version.txt', 'Cargo.lock', 'Cargo.toml') }}
      - name: Rust tests
        run: cargo test --locked
      - name: Prepare AppImage runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          runtime="$RUNNER_TEMP/runtime-x86_64"
          curl --fail --location --retry 3 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 \
            --output "$runtime"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $runtime" | sha256sum --check
          echo "APPIMAGE_RUNTIME=$runtime" >> "$GITHUB_ENV"
          echo 'MKSQUASHFS=/usr/bin/mksquashfs' >> "$GITHUB_ENV"
      - name: Build Linux package
        if: runner.os == 'Linux'
        run: bash scripts/build-linux.sh
      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Check extracted packages
        run: python scripts/check-package.py packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Garage-${{ matrix.platform }}
          path: |
            dist/Garage-*-x86_64.AppImage
            dist/Garage-*-x86_64.tar.gz
            dist/Garage-*-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: Garage-*
          merge-multiple: true
          path: packages
      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cd packages
          assets=("Garage-$version-x86_64.AppImage" "Garage-$version-x86_64.tar.gz" "Garage-$version-windows-x86_64.zip")
          for asset in "${assets[@]}"; do test -s "$asset"; done
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

          # Fail on authentication/network errors; an absent release is a normal case.
          releases=$(gh release list --limit 1000 --json tagName,isDraft)
          state=$(jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tagName == $tag) | if .isDraft then "draft" else "published" end' <<< "$releases")
          if [ "$state" = published ]; then
            echo "Release $RELEASE_TAG is already published; preserving its assets."
            exit 0
          fi
          if [ -z "$state" ]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Garage $version"
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
